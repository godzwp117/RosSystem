# 三个真实成员模块联合运行配置（受信任本地文件）
#
# 用途
# ----
#   python3 scripts/team_demo.py --input ENVELOPE.json --config config/team_modules.all-real.yaml
#
# 这是"三个真实模块同时被 F0 调用"的配置，供工作 B1 的联合运行器使用。
#
# 会得到什么结论
# --------------
# **ADAPTER_BLOCK**。不是配置写错，而是当前真实能力的事实：
#   * comm_risk      : 交付模型 validation_gate_passed=false，且受信任配置没有
#                      声明可信观察来源 -> 低于阈值只能是 UNKNOWN；
#   * identity_trust : 历史受控实验只解释**当时那次运行**的授权，
#                      当前请求身份绑定为 UNKNOWN（ROS 2 无可用中间件 API）；
#   * task_risk      : 真实规则引擎，可以给出 ALLOW_RECOMMENDED。
# 只要有一个模块不是推进状态，F0 就阻断。这正是"无可信证据必须失败关闭"。
#
# 想要看到 READY 的全链路，请使用
# config/team_modules.all-real.controlled-test.yaml ——它是**受控测试**配置，
# 不能作为生产或在线安全结论的依据。
adapter:
  log_path: logs/all-real/adapter.jsonl
  planner_command: [ros2, run, rg_demo_nodes, planner_node]

modules:
  comm_risk:
    mode: external
    interface: comm_risk_evidence
    command: [python3, modules/member1_comm/module.py,
              --model, modules/member1_comm/model/comm_risk_model.json,
              --model-sha256, d45d272eea9dfef67b2b0066af0fd078270d559a4a4e350b7558d072c21c40df,
              --features, modules/member1_comm/features.json,
              --observation-provenance, UNKNOWN]
    timeout_sec: 10
    max_stdout_bytes: 65536
    allow_fault_injection: false
  identity_trust:
    mode: external
    interface: identity_trust_assessment
    command: [python3, identity_trust/assessor.py,
              --experiment-run, "20261009T093144Z",
              --evidence-root, artifacts/acceptance/exports/m2_sros2_enforce/logs/tests_evidence,
              --policy, security/policies/minimal_permissions.xml,
              --keystore, security/keystore,
              --case, S2,
              --identity-ledger, logs/all-real/identity_ledger.jsonl]
    timeout_sec: 10
    max_stdout_bytes: 65536
    allow_fault_injection: false
  task_risk:
    mode: external
    interface: task_risk_decision
    command: [python3, modules/member3_taskrisk/module.py,
              --policy, config/task_policy.yaml]
    timeout_sec: 10
    max_stdout_bytes: 65536
    allow_fault_injection: false
