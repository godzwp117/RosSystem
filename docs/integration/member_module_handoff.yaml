system_level:
  adapter_changes:
    - path: "scripts/team_demo.py"
      sha256: "785195be37dc976b7cd1492c06fbd5db27dcfb1471aa6b26c48d69e39e10e6ac"
      changes:
        - "新增 REQUIRED_CURRENT_IDENTITY：身份位置必须给出 AUTHENTICATED 当前身份"
        - "新增原因码 ADAPTER_CURRENT_IDENTITY_UNBOUND"
        - "历史授权（AUTHORIZED）不再单独构成推进条件"
  acceptance_harness_changes:
    - path: "scripts/check_member_module.py"
      sha256: "5be88371a38c1e292885f1c5346c7c3b44d44f3c7bf3e17ef38f647bf3748188"
      changes:
        - "build_envelope 注入真实通信观测块（来自已提交的真实 held-out 行）"
        - "真实 fixture 支持 expect.adapter_decision / adapter_reason"
        - "reason_code 读取 extensions.member1_comm"
        - "正向对照替身为身份模块补充 current_request_identity（MOCK_FIXTURE）"
  new_configs:
    - "config/team_modules.member1.real.yaml"
    - "config/team_modules.all-real.yaml"
    - "config/team_modules.all-real.controlled-test.yaml"
    - "config/acceptance/real_scenarios.member1.yaml"
  b1_required_changes:
    - id: P0-2
      severity: HIGH
      file: scripts/team_demo.py
      requirement: >-
        身份位置的判定必须从"比较 extensions.current_request_identity.status
        字符串"改为调用 identity_trust.current_identity.f0_accepts(current)。
        当前实现允许一个只自报 status 的模块通过（已实测 READY_FOR_GATEWAY_SUBMISSION）。
      one_line_patch: |
        from identity_trust.current_identity import f0_accepts
        current = (outputs['identity_trust'].get('extensions') or {}).get('current_request_identity')
        if not f0_accepts(current):
            raise AdapterBlock(REASON_CURRENT_IDENTITY_UNBOUND, '当前身份未通过受信任核验')
      tripwire_tests:
        - tests/unit/test_phase2_security_boundaries.py::test_f0_rejects_bare_status_self_report
        - tests/unit/test_phase2_security_boundaries.py::test_f0_rejects_mock_fixture_identity
      note: 两个用例当前是 xfail（断言 F0 应阻断、而实际放行）。B1 修好后改成普通断言。
    - id: P0-2b
      severity: MEDIUM
      requirement: >-
        真实模式下应拒绝 evidence_kind == "MOCK_FIXTURE" 的身份对象；Mock 演示保留在
        mode: mock 的配置里。
  compatibility_notes_for_B1:
    - >-
      F0 会先调用**全部**三个模块再做推进判定；只有进程/协议级故障
      （超时、非零退出、Schema 非法）才会立即中断。因此一次 F0 调用即可拿到
      三个模块的真实证据。
    - >-
      身份位置新增硬性要求：缺少 extensions.current_request_identity 或状态不是
      AUTHENTICATED，一律 ADAPTER_CURRENT_IDENTITY_UNBOUND。Mock/替身必须显式
      给出该字段（MOCK_FIXTURE），真实模块给 UNKNOWN —— 这是刻意的。
    - >-
      --identity-ledger 是运行时状态。重复使用同一 request_id 的第二次联合运行
      会被正确判定为"历史授权复用"-> UNKNOWN。做可重复验收时要么每次清理账本，
      要么每次使用新的 request_id。
    - >-
      交付配置使用裸 python3；解释器必须装有 jsonschema>=4.0。B1 应显式固定解释器。
    - >-
      公共 Schema 未改动、契约版本仍为 1.0.0-proposed；新增内容全部位于
      extensions（兼容扩展）或适配层规则（见 docs/interfaces/CONTRACT_VERSION.md 规则九）。
    - >-
      【第二阶段】M2 的当前身份契约升级为 current-identity-attestation/2：
      新增 checks 五元组与 f0_accepts()；AUTHENTICATED 必须同时满足签名有效、
      签发者被受信任清单标记为 VERIFIED_IDENTITY_SOURCE、请求摘要匹配、新鲜、
      nonce 原子预留。仓库不交付该清单，因此真实路径恒 UNKNOWN。
    - >-
      【第二阶段】--identity-issuers 为新增受信任参数；未配置时永不 AUTHENTICATED。
      --identity-ledger 从"可选"变为 AUTHENTICATED 的必要条件。

