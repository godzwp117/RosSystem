# 成员一真实通信风险模块验收 fixture（受信任本地文件）
#
# 用法
# ----
#   python3 scripts/check_member_module.py --module comm_risk \
#       --config config/team_modules.member1.real.yaml \
#       --real-fixture config/acceptance/real_scenarios.member1.yaml
#
# 数据来源
# --------
# observations[].detail.rospace_comm.features 的数值不是随机数，而是
# tests/fixtures/member1/rospace_comm_rows.json 里的**真实 held-out 数据行**
# （ROSPaCe 测试分片 13/14，由 modules/member1_comm/export_probe_rows.py 导出，
# 分片号/原始 CSV 行号/标签/模型打分全部可追溯）。
#
# 语义边界
# --------
# * 这是 L1 协议可达性验收：证明真实模型在真实子进程里被调用、四条状态码
#   都能到达、失败关闭有效。**不是**检测效果评估（L2）、**不是**在线监测（L3）。
# * normal-controlled 期望 NORMAL，但它只在受信任命令档案
#   model_controlled_test（含 --controlled-test）下成立，输出里会写明
#   CONTROLLED_TEST_ONLY。交付模型 validation_gate_passed=false，生产语义下
#   低于阈值只能是 UNKNOWN。
# * 这里没有任何按标签挑选样本的动作：期望状态由已发布的决策规则推出。
schema_version: "1.0.0"

real_scenarios:

