      EVIDENCE_VALID: >-
        规则依据、策略版本、命中规则均写入 rule_basis / extensions.member3，
        策略文件本身可追溯且未改动。
      ONLINE_PROCEED_READY: >-
        M3 是三者中唯一能在真实条件下给出 ALLOW_RECOMMENDED 的模块；
        "可推进"指它的规则引擎可用，不表示整条链路能通过
        （M1/M2 的真实结论会阻断）。ALLOW_RECOMMENDED 仍不是 Gateway 准入。
