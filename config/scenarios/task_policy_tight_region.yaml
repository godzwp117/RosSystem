# =============================================================================
# 隔离的**测试**策略 fixture —— 允许区域收窄到 [0,1] x [0,1]
#
# 用途：让真实条件触发「违规任务 -> BLOCK_RECOMMENDED」。
# 候选目标 (2.0, 2.0) 落在 [0,4] x [0,4] 之内，但落在本 fixture 之外，
# 因此真实规则模块必须自行推出 OUT_OF_REGION，而不是由测试断言直接指定状态。
#
# 安全边界
# --------
# * 这是**测试 fixture**，不是权威策略。
# * config/task_policy.yaml（Gateway 唯一权威）从不被本文件替换或修改。
# * 本文件不得用于 Gateway 启动；它只在离线验收进程中被只读打开。
# =============================================================================
task_id: patrol_a_001
policy_version: "1.0-acceptance-tight"
active: true
coordinate_frame: map
allowed_region: {x_min: 0.0, x_max: 1.0, y_min: 0.0, y_max: 1.0}
max_requests_per_minute: 10
